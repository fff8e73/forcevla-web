[project]
name = "forcevla-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "numpy>=1.26,<3", "pillow>=10,<13", "scipy>=1.12,<2", "grpcio>=1.78,<2", "protobuf>=6.31,<7"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = [".", "tests/robot_control"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
